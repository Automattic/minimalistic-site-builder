name: Block fixer oracle

# The pure-PHP block fixer is certified against artifacts a Node oracle derives
# from the real @wordpress/blocks runtime. That oracle now lives in the tree
# (bin/block-fixer/ plus the two generators) as development tooling — nothing in
# the PHP pipeline calls it, and production still runs pure PHP.
#
# This job re-derives every frozen artifact and fails on drift, so a change to
# the serializer, the reviewed support manifest or the case definitions cannot
# land unless the real Gutenberg runtime agrees with it.
#
# No container: the artifacts' environment-derived fields are the Node version,
# v8, ICU, platform and architecture; `fingerprint.container` is a constant the
# generator writes rather than something it probes. ubuntu-24.04 with the pinned
# Node is already linux/x64 with the same v8 and ICU as the frozen manifest.
# Regenerating from a non-linux/x64 machine does need the container — see
# docs/block-fixer-oracle.md.

on:
  pull_request:
    paths:
      - 'src/BlockSerializer/**'
      - 'bin/block-fixer/**'
      - 'bin/generate-block-*.js'
      - 'tests/fixtures/block-fixer/**'
      - '.github/workflows/block-fixer-oracle.yml'
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: Artifacts re-derive from the real runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up the pinned Node
        uses: actions/setup-node@v4
        with:
          # Must match `fingerprint.node.version` in the frozen manifest: the
          # artifacts record v8 and ICU, which move with the Node release.
          node-version: '22.19.0'

      - name: Confirm the runtime matches the frozen fingerprint
        run: node bin/block-fixer/check-fingerprint.js

      - name: Install locked dependencies
        run: npm ci

      # The gate: every committed artifact must be exactly what the real
      # Gutenberg runtime derives.
      - name: Re-derive every frozen artifact and fail on drift
        run: npm run oracle:verify --workspace=bin/block-fixer

      # Not blocking yet. The oracle's fixed-point suite reports one committed
      # golden it disagrees with — carried-elements-signatures, where the PHP
      # port drops a legacy heading alignment the real runtime migrates. That
      # divergence is a separate fix; once it lands this becomes a gate like the
      # one above.
      - name: Run the oracle's own test suite (advisory)
        run: npm test --workspace=bin/block-fixer
        continue-on-error: true
