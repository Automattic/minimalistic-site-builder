name: Block fixer oracle

# Re-derives every artifact the pure-PHP block fixer is certified against from
# the real @wordpress/blocks runtime, and fails on drift. What that proves and
# why it matters: docs/block-fixer-oracle.md, "Is it still alive? (CI)".
#
# No container: the artifacts' environment-derived fields are the Node version,
# v8, ICU, platform and architecture; `fingerprint.container` is a constant the
# generator writes rather than something it probes. ubuntu-24.04 with the pinned
# Node is already linux/x64 with the same v8 and ICU as the frozen manifest.
# Regenerating from a non-linux/x64 machine does need the container — see
# docs/block-fixer-oracle.md.

on:
  pull_request:
    paths:
      - 'src/BlockSerializer/**'
      - 'bin/block-fixer/**'
      - 'bin/generate-block-*.js'
      - 'tests/fixtures/block-fixer/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/block-fixer-oracle.yml'
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: Artifacts re-derive from the real runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up the pinned Node
        uses: actions/setup-node@v4
        with:
          # Must match `fingerprint.node.version` in the frozen manifest: the
          # artifacts record v8 and ICU, which move with the Node release.
          node-version: '22.19.0'

      - name: Confirm the runtime matches the frozen fingerprint
        run: node bin/block-fixer/check-fingerprint.js

      - name: Install locked dependencies
        run: npm ci

      # The gate: every committed artifact must be exactly what the real
      # Gutenberg runtime derives.
      - name: Re-derive every frozen artifact and fail on drift
        run: npm run oracle:verify --workspace=bin/block-fixer

      - name: Run the oracle's own gates
        run: npm run test:gates --workspace=bin/block-fixer

      # The one test that is not yet a gate. It replays every committed case —
      # including the ones held back from the generator, which nothing else
      # checks — and reports the single golden the oracle disagrees with:
      # carried-elements-signatures, where a heading keeps its alignment class in
      # the real runtime and loses it here. See docs/block-fixer-oracle.md, "The
      # one divergence, precisely". Once that fix lands this becomes a gate too.
      - name: Replay every committed case against the runtime (advisory)
        run: npm run test:fixed-point --workspace=bin/block-fixer
        continue-on-error: true
