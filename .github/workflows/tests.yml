name: Tests

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor composer.json declares, and a current release. The builder
        # ships into hosts that pin either end.
        php: ['8.1', '8.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none

      # The package autoloads itself (autoload.php); composer install is only
      # needed for the optional WordPress HTML API used by the seeder parity
      # test, which skips itself when absent.
      - name: Lint every PHP file
        run: |
          find src bin tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Unit tests
        run: php tests/run.php

      - name: Integration tests
        run: php tests/run-integration.php
